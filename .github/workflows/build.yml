name: build

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'App id to build (or "all")'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEYSTORE_BKS: ${{ secrets.KEYSTORE_BKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: python3 scripts/build.py --app "${{ github.event.inputs.app || 'all' }}"

      - name: Commit manifest
        run: |
          git config user.name 'morphe-bot'
          git config user.email 'morphe-bot@users.noreply.github.com'
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update manifest.json'
            git push
          else
            echo "no manifest changes"
          fi
